spring:
  application:
    name: nutricoach

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate   # Liquibase owns the schema — never let Hibernate modify it
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET}          # Base64-encoded 256-bit key
    expiry-hours: 72

  msg91:
    auth-key: ${MSG91_AUTH_KEY}
    template-id: ${MSG91_TEMPLATE_ID}
    sender-id: NUTRIC
    dev-mode: ${MSG91_DEV_MODE:false}

  wati:
    api-endpoint: ${WATI_API_ENDPOINT}
    api-token: ${WATI_API_TOKEN}

  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
    dev-mode: ${RAZORPAY_DEV_MODE:false}
    plan-ids:
      starter: ${RAZORPAY_PLAN_ID_STARTER}
      professional: ${RAZORPAY_PLAN_ID_PROFESSIONAL}
      enterprise: ${RAZORPAY_PLAN_ID_ENTERPRISE}

  aws:
    region: ap-south-1
    s3:
      bucket: ${S3_BUCKET_NAME}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  # Public URL of the client portal, used in the WhatsApp invite a coach sends.
  # No default: an invite carrying the wrong host is worse than a clear error.
  portal-url: ${PORTAL_URL:}

  openai:
    api-key: ${OPENAI_API_KEY}

# Error monitoring. An empty DSN disables Sentry entirely, which is what keeps
# local dev and the test suite silent — there is no dev-mode flag to get wrong.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  traces-sample-rate: 0.1
  # Never attach request bodies, headers or user identifiers. Phone numbers are
  # the login credential here and client rows carry health data; neither belongs
  # in a third-party issue tracker.
  send-default-pii: false
  # NutriCoachException is the business-error type behind every 400/402/404/409.
  # Reporting those would bury the real 500s under "Client not found".
  ignored-exceptions-for-type: com.nutricoach.common.exception.NutriCoachException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.nutricoach: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
